[project]
name = "design-generators"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shunsuke Kitada" },
]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = []

[project.optional-dependencies]
evaluation = [
    "evaluate",
    "jaxtyping",
    "numpy",
    "opencv-python",
    "Pillow",
    "prdc",
    "pytorch-fid",
    "torch",
]

[dependency-groups]
dev = [
    "beartype>=0.22.9,<0.23",
    "pre-commit>=4.6.0",
    "pylint>=4.0.0",
    "pytest>=6.0.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0,<4",
    "PyYAML>=6.0",
    "ruff>=0.1.5",
    "ty>=0.0.10",
    "vulture>=2.16",
]
docs = [
    "mkdocstrings[python]>=0.31.0",
    "zensical>=0.0.50,<0.1",
]

[tool.uv]
constraint-dependencies = [
    "transformers>=5.0.0",
    "diffusers>=0.36.0",
]
conflicts = [
    # basnet[vendor] -> scikit-image>=0.21 -> networkx>=2.8; housegan[vendor] pins networkx==2.4.
    [
        { package = "basnet", extra = "vendor" },
        { package = "housegan", extra = "vendor" },
    ],
    # laygen[agents] -> pydantic-ai>=2.7.0 -> protobuf>=5; flex-dm[vendor-tf] -> TensorFlow 2.15.1 -> protobuf<5.
    [
        { package = "laygen", extra = "agents" },
        { package = "flex-dm", extra = "vendor-tf" },
    ],
    # laygen[agents] -> pydantic-ai>=2.7.0 -> protobuf>=5; flex-dm[convert] -> tensorflow-cpu 2.15.1 -> protobuf<5.
    [
        { package = "laygen", extra = "agents" },
        { package = "flex-dm", extra = "convert" },
    ],
    # layout-gpt -> pydantic-ai>=2.7.0 -> protobuf>=5; flex-dm[vendor-tf] -> TensorFlow 2.15.1 -> protobuf<5.
    [
        { package = "layout-gpt" },
        { package = "flex-dm", extra = "vendor-tf" },
    ],
    # layout-gpt -> pydantic-ai>=2.7.0 -> protobuf>=5; flex-dm[convert] -> tensorflow-cpu 2.15.1 -> protobuf<5.
    [
        { package = "layout-gpt" },
        { package = "flex-dm", extra = "convert" },
    ],
    # layoutprompter -> pydantic-ai>=2.7.0 -> protobuf>=5; flex-dm[vendor-tf] -> TensorFlow 2.15.1 -> protobuf<5.
    [
        { package = "layoutprompter" },
        { package = "flex-dm", extra = "vendor-tf" },
    ],
    # layoutprompter -> pydantic-ai>=2.7.0 -> protobuf>=5; flex-dm[convert] -> tensorflow-cpu 2.15.1 -> protobuf<5.
    [
        { package = "layoutprompter" },
        { package = "flex-dm", extra = "convert" },
    ],
    # postero -> pydantic-ai>=2.7.0 -> protobuf>=5; flex-dm[vendor-tf] -> TensorFlow 2.15.1 -> protobuf<5.
    [
        { package = "postero" },
        { package = "flex-dm", extra = "vendor-tf" },
    ],
    # postero -> pydantic-ai>=2.7.0 -> protobuf>=5; flex-dm[convert] -> tensorflow-cpu 2.15.1 -> protobuf<5.
    [
        { package = "postero" },
        { package = "flex-dm", extra = "convert" },
    ],
    # housegan[vendor] pins networkx==2.4; smarttext[vendor] -> scikit-image>=0.21 -> networkx>=2.8.
    [
        { package = "housegan", extra = "vendor" },
        { package = "smarttext", extra = "vendor" },
    ],
    # housegan[vendor] pins networkx==2.4; flex-dm[vendor-tf] -> tensorflow[and-cuda]==2.15.1 pins nvidia-cublas-cu12==12.2.5.6 and nvidia-cusparse-cu12==12.1.2.141, conflicting with torch<=2.10 and forcing torch>=2.9 -> networkx>=2.5.1.
    [
        { package = "housegan", extra = "vendor" },
        { package = "flex-dm", extra = "vendor-tf" },
    ],
]

[tool.uv.workspace]
members = ["lib/*", "models/*"]

[tool.uv.sources]
basnet = { workspace = true }
coarse-to-fine = { workspace = true }
cgb-dm = { workspace = true }
dlt = { workspace = true }
ds-gan = { workspace = true }
flex-dm = { workspace = true }
housegan = { workspace = true }
layout-corrector = { workspace = true }
layout-detr = { workspace = true }
layoutdiffusion = { workspace = true }
layout-fid = { workspace = true }
layout-flow = { workspace = true }
layout-gpt = { workspace = true }
ltnet = { workspace = true }
layout-action = { workspace = true }
layoutvae = { workspace = true }
lace = { workspace = true }
layoutganpp = { workspace = true }
layout-dm = { workspace = true }
layoutprompter = { workspace = true }
layousyn = { workspace = true }
laygen = { workspace = true }
layoutformerpp = { workspace = true }
parse-then-place = { workspace = true }
posterllama = { workspace = true }
posterllava = { workspace = true }
postero = { workspace = true }
posgen = { workspace = true }
ralf = { workspace = true }
smarttext = { workspace = true }
traingen = { workspace = true }
traingen-parity = { workspace = true }

[tool.ruff]
exclude = ["vendor"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
extend-select = ["ANN", "D", "TID251"]
# jaxtyping shape strings are intentionally not Python names or expressions inside
# quoted annotations. Ruff/Pyflakes F722 and F821 are structurally incompatible
# with this syntax; globally ignoring them is the ecosystem-standard workaround.
ignore = ["F722", "F821"]

[tool.ruff.lint.per-file-ignores]
"lib/*/tests/*.py" = ["ANN", "D"]
"lib/*/tests/**/*.py" = ["ANN", "D"]
"models/*/scripts/**/*.py" = ["ANN", "D"]
"models/*/tests/*.py" = ["ANN", "D"]
"models/*/tests/**/*.py" = ["ANN", "D"]
"scripts/**/*.py" = ["ANN", "D"]
"tests/*.py" = ["D"]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Use precise types; justify exceptions with noqa + reason"

[tool.ty.rules]
all = "error"
missing-override-decorator = "ignore"
unsupported-base = "ignore"
unresolved-import = "ignore"

[tool.ty.src]
exclude = ["vendor", "models/flex-dm/scripts", "models/flex-dm/tests"]

[tool.pylint.main]
ignore = ["vendor", ".cache", "site"]

[tool.pylint.messages_control]
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
min-similarity-lines = 8

[tool.pytest.ini_options]
testpaths = ["tests", "lib", "models"]
addopts = ["--import-mode=importlib"]
pythonpath = ["scripts"]
markers = [
    "integration: tests that require external downloads or heavyweight runtime setup",
    "training: tests that exercise Lightning training loops or training CLI entrypoints",
    "vendor_parity: requires original model weights and vendor dependencies",
]

[tool.coverage.run]
branch = true
omit = [
    "tests/*",
    "tests/**/*",
    "models/*/tests/vendor_parity/*",
    "models/*/tests/vendor_parity/**/*",
    "models/layout-dm/src/layout_dm/training/*",
    "models/layout-flow/src/layout_flow/training/*",
    "models/layoutdiffusion/src/layoutdiffusion/training/*",
    "scripts/*",
    "scripts/**/*",
    "vendor/*",
    "vendor/**/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.vulture]
min_confidence = 70
sort_by_size = true
paths = ["lib", "models", "scripts"]
verbose = false
