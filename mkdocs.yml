site_name: design-generators
site_description: Transformers- and Diffusers-style layout and graphic-design generation packages.
site_url: https://creative-graphic-design.github.io/design-generators/
repo_url: https://github.com/creative-graphic-design/design-generators
repo_name: creative-graphic-design/design-generators
copyright: Copyright &copy; 2026 Creative Graphic Design Lab
extra_css:
  - stylesheets/extra.css

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: lucide/moon
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.suggest

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/creative-graphic-design
      name: creative-graphic-design on GitHub
    - icon: fontawesome/brands/hugging-face
      link: https://huggingface.co/creative-graphic-design
      name: creative-graphic-design on Hugging Face
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/cgd_lab
      name: Creative Graphic Design Lab on X

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Conventions: conventions.md
  - Architecture: architecture.md
  - Training Reproduction: training-reproduction.md
  - Extending: extending.md
  - API Reference:
      - Overview: api/index.md
      - Libraries:
          - laygen: api/libraries/laygen.md
          - posgen: api/libraries/posgen.md
          - traingen: api/libraries/traingen.md
          - traingen-parity: api/libraries/traingen-parity.md
      - Models:
          - basnet: api/models/basnet.md
          - cgb-dm: api/models/cgb-dm.md
          - coarse-to-fine: api/models/coarse-to-fine.md
          - dlt: api/models/dlt.md
          - ds-gan: api/models/ds-gan.md
          - flex-dm: api/models/flex-dm.md
          - housegan: api/models/housegan.md
          - lace: api/models/lace.md
          - layousyn: api/models/layousyn.md
          - layout-action: api/models/layout-action.md
          - layout-corrector: api/models/layout-corrector.md
          - layout-detr: api/models/layout-detr.md
          - layout-dm: api/models/layout-dm.md
          - layout-fid: api/models/layout-fid.md
          - layout-flow: api/models/layout-flow.md
          - layout-gpt: api/models/layout-gpt.md
          - layoutdiffusion: api/models/layoutdiffusion.md
          - layoutformerpp: api/models/layoutformerpp.md
          - layoutganpp: api/models/layoutganpp.md
          - layoutprompter: api/models/layoutprompter.md
          - layoutvae: api/models/layoutvae.md
          - ltnet: api/models/ltnet.md
          - parse-then-place: api/models/parse-then-place.md
          - posterllama: api/models/posterllama.md
          - posterllava: api/models/posterllava.md
          - postero: api/models/postero.md
          - ralf: api/models/ralf.md
          - smarttext: api/models/smarttext.md

markdown_extensions:
  - admonition
  - pymdownx.emoji:
      emoji_generator: zensical.extensions.emoji.to_svg
      emoji_index: zensical.extensions.emoji.twemoji
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
  - tags
  - mkdocstrings:
      handlers:
        python:
          paths:
            - lib/*/src
            - models/*/src
          options:
            docstring_style: google
            members_order: source
            separate_signature: true
            show_signature_annotations: true
