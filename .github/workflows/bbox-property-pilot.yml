name: BBox Property Validation (Pilot)

on:
  pull_request:
    paths:
      - "lib/laygen/src/laygen/common/bbox.py"
      - "verification/bbox/**"
      - ".github/workflows/bbox-property-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-properties:
    name: BBox Hypothesis and Mutation Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Check bbox invariants on production functions
        run: |
          uv run --locked --package laygen --extra torch --with hypothesis==6.131.0 --with pytest==8.4.2 \
            python -m pytest verification/bbox/test_bbox_properties.py -q
      - name: Verify an actual-code mutation fails (and restore source)
        run: |
          uv run --locked --package laygen --extra torch --with hypothesis==6.131.0 --with pytest==8.4.2 \
            python verification/bbox/check_actual_mutation.py
