name: Draft PR Audit

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  draft-pr-audit:
    name: Draft PR Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Audit complete draft pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_draft_prs.py --comment
