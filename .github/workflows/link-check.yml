name: Link Check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Lychee
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: List tracked Markdown files
        run: git ls-files "*.md" ":(exclude)vendor/**" > .lychee-inputs

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --no-progress
            --verbose
            --format markdown
            --output lychee-report.md
            --scheme http
            --scheme https
            --files-from .lychee-inputs

      - name: Summarize link check
        if: always()
        run: |
          if [ -f lychee-report.md ]; then
            cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "lychee did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on broken links
        if: steps.lychee.outcome == 'failure'
        run: exit 1
