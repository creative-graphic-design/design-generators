name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
  merge_group:
  push:
    branches:
      - main

jobs:
  pr-metadata:
    name: PR Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check issue reference
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_pr_issue_reference.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Skip issue reference outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "PR metadata checks are only required for pull_request events."

  changed-url-check:
    name: Changed URL Check
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check newly added URLs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: python scripts/check_changed_urls.py --base "$BASE_SHA" --head "$HEAD_SHA"

  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      non_markdown: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.non_markdown }}
      docs_content: ${{ steps.docs_filter.outputs.docs_content }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-markdown changes
        id: filter
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            non_markdown:
              - '**'
              - '!**/*.md'

      - name: Detect documentation content changes
        id: docs_filter
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docs_content:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'lib/**'
              - 'models/**'
              - 'README.md'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install workspace dependencies
        run: |
          # Install every uv workspace member for CI checks. Member extras are
          # intentionally omitted; test suites are expected to run without them.
          # The docs group is included because generated documentation helpers
          # are typechecked with the rest of the repository.
          uv sync --all-packages --group docs

      - name: Check lockfile
        run: uv lock --check

      - name: Run pre-commit
        env:
          # uv-lock is a writer hook, and CI must not modify files.
          #
          # pytest-models duplicates the coverage-enforcing member matrix, and
          # vulture runs as the dedicated Dead Code job below on merge queue,
          # main pushes, manual dispatches, and scheduled runs.
          SKIP: uv-lock,pytest-models,vulture
        run: uv run pre-commit run --all-files

  dead-code:
    name: Dead Code
    if: github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Run vulture
        run: uv run --package design-generators vulture

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.non_markdown == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install workspace dependencies
        run: |
          # Install every uv workspace member for CI checks. Member extras are
          # intentionally omitted; test suites are expected to run without them.
          # The docs group is included because generated documentation helpers
          # are typechecked with the rest of the repository.
          uv sync --all-packages --group docs

      - name: Run ty
        run: uv run ty check lib models tools

  discover-test-members:
    name: Discover Test Members
    needs: changes
    if: needs.changes.outputs.non_markdown == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      members: ${{ steps.members.outputs.members }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: List workspace members with tests
        id: members
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "${BASE_SHA}" ]; then
            members="$(scripts/select_test_members.py --base "${BASE_SHA}" --head "${HEAD_SHA}")"
          else
            members="$(scripts/select_test_members.py)"
          fi
          echo "members=${members}" >> "${GITHUB_OUTPUT}"

  test-root-tooling:
    name: Test (root tooling)
    needs: changes
    if: needs.changes.outputs.non_markdown == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install root-tooling dependencies
        run: uv sync --package design-generators --group dev

      - name: Assert root environment excludes workspace members
        run: uv pip list --editable --format json | jq -e 'map(.name) | sort == ["devharness"]'

      - name: Run root tests
        run: |
          mkdir -p coverage-root
          COVERAGE_FILE=coverage-root/.coverage \
            uv run --no-sync --package design-generators coverage run \
            --rcfile=/dev/null --include='scripts/*.py' \
            -m pytest tests -m "not integration" --import-mode=importlib
          COVERAGE_FILE=coverage-root/.coverage \
            uv run --no-sync --package design-generators coverage report --rcfile=/dev/null
          COVERAGE_FILE=coverage-root/.coverage \
            uv run --no-sync --package design-generators coverage xml \
            --rcfile=/dev/null -o coverage-root/root.xml

      - name: Check full-workspace compatibility
        run: |
          # Keep an explicit compatibility check for the all-packages
          # environment after the root-tooling test has run in isolation.
          uv sync --all-packages

      - name: Upload root coverage to Codecov
        if: github.event_name != 'merge_group'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-root/root.xml
          flags: root
          fail_ci_if_error: false

  evaluation-extra-smoke:
    name: Evaluation extra smoke
    needs: changes
    if: needs.changes.outputs.non_markdown == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install evaluation extra
        run: uv sync --package design-generators --extra evaluation

      - name: Run evaluation verifier help
        run: uv run --no-sync --package design-generators scripts/verify_evaluate_layout_metrics.py --help

      - name: Smoke test evaluation imports
        run: uv run --no-sync --package design-generators python -c "import cv2, prdc, pytorch_fid.fid_score"

  test-member:
    name: Test (member)
    needs:
      - changes
      - discover-test-members
    if: needs.changes.outputs.non_markdown == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJson(needs.discover-test-members.outputs.members) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install workspace member dependencies
        run: uv sync --package "${{ matrix.member.package }}"

      - name: Run workspace member tests
        env:
          MEMBER_TEST_COVERAGE_XML_DIR: coverage-reports
          WORKSPACE_COVERAGE_FAIL_UNDER: "90"
        run: scripts/run_member_tests.sh "${{ matrix.member.dir }}"

      - name: Upload member coverage to Codecov
        if: github.event_name != 'merge_group'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-reports/${{ matrix.member.package }}.xml
          flags: ${{ matrix.member.package }}
          fail_ci_if_error: false

  test:
    name: Test
    needs:
      - changes
      - discover-test-members
      - test-root-tooling
      - evaluation-extra-smoke
      - test-member
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check test results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NON_MARKDOWN: ${{ needs.changes.outputs.non_markdown }}
          DISCOVER_RESULT: ${{ needs.discover-test-members.result }}
          MEMBERS: ${{ needs.discover-test-members.outputs.members }}
          TEST_ROOT_RESULT: ${{ needs.test-root-tooling.result }}
          EVALUATION_RESULT: ${{ needs.evaluation-extra-smoke.result }}
          TEST_MEMBER_RESULT: ${{ needs.test-member.result }}
        run: |
          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "Changes result: ${CHANGES_RESULT}" >&2
            exit 1
          fi

          if [ "${NON_MARKDOWN}" != "true" ]; then
            echo "No non-Markdown changes; workspace tests were skipped."
            exit 0
          fi

          if [ "${DISCOVER_RESULT}" != "success" ]; then
            echo "Discover Test Members result: ${DISCOVER_RESULT}" >&2
            exit 1
          fi

          if [ "${TEST_ROOT_RESULT}" != "success" ]; then
            echo "Test (root tooling) result: ${TEST_ROOT_RESULT}" >&2
            exit 1
          fi

          if [ "${EVALUATION_RESULT}" != "success" ]; then
            echo "Evaluation extra smoke result: ${EVALUATION_RESULT}" >&2
            exit 1
          fi

          if [ "${TEST_MEMBER_RESULT}" != "success" ]; then
            if [ "${MEMBERS}" != "[]" ] || [ "${TEST_MEMBER_RESULT}" != "skipped" ]; then
              echo "Test (member) result: ${TEST_MEMBER_RESULT}" >&2
              exit 1
            fi
            echo "No workspace members with tests were selected."
          fi

  notify-scheduled-failure:
    name: Scheduled Failure Notification
    needs:
      - pr-metadata
      - changes
      - lint
      - dead-code
      - typecheck
      - discover-test-members
      - test-root-tooling
      - evaluation-extra-smoke
      - test-member
      - test
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Comment on the tracking issue and notify a maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 476 \
            --repo "${GITHUB_REPOSITORY}" \
            --body "@shunk031 Daily full member test run failed: ${RUN_URL}"

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs_content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --all-packages --group docs

      - name: Build documentation
        run: uv run --group docs zensical build --strict -f mkdocs.yml

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pages:
    name: Deploy Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.docs_content == 'true'
    needs:
      - changes
      - docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
