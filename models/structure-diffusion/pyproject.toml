[project]
name = "structure-diffusion"
version = "0.1.0"
description = "Diffusers pipeline for training-free structured diffusion guidance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "diffusers[torch]>=0.36.0",
    "huggingface-hub>=0.24",
    "jaxtyping>=0.3",
    "nltk>=3.8",
    "numpy>=1.24",
    "pillow>=10",
    "stanza>=1.8",
    "torch>=2.1",
    "transformers>=5.0.0",
]

[project.optional-dependencies]
scene-graph = ["SceneGraphParser>=0.1.0"]
vendor = [
    "einops>=0.8",
]

[tool.design-generators]
framework = "diffusers"
task = "text-to-image-generation"
conditions = ["prompt"]
datasets = []

[tool.design-generators.hub-publisher]
repo-id = "creative-graphic-design/structure-diffusion"
archive-url-count = 1

[tool.design-generators.hub-publisher.files]
"README.md" = "README.md"
"pipeline.py" = "src/structure_diffusion/pipeline_structure_diffusion.py"
"modeling_structure_diffusion.py" = "src/structure_diffusion/modeling_structure_diffusion.py"
"processing_structure_diffusion.py" = "src/structure_diffusion/processing_structure_diffusion.py"

[tool.pytest.ini_options]
markers = [
    "integration: requires downloaded Stable Diffusion weights and parser models",
    "vendor_parity: requires Stable Diffusion weights and the pinned vendor source",
]

[tool.coverage.run]
branch = true
source = ["structure_diffusion"]
omit = [
    "models/structure-diffusion/tests/vendor_parity/*",
    "*/tests/vendor_parity/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
