[project]
name = "posterllama"
version = "0.1.0"
description = "PosterLlama processor and inference recipe."
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.36",
    "jaxtyping>=0.3",
    "laygen",
    "numpy>=1.26",
    "pillow>=10",
    "posgen",
    "torch>=2.0",
    "transformers[torch,vision]>=5.0.0",
]

[tool.uv.sources]
laygen = { workspace = true }
posgen = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=7.0.0",
]

[project.optional-dependencies]
vendor = [
    "accelerate>=0.24",
    "deepspeed>=0.13",
    "diffusers>=0.25",
    "iopath>=0.1",
    "ml-collections>=0.1",
    "omegaconf>=2.3",
    "peft>=0.6",
    "sentencepiece>=0.1",
    "timm>=0.9",
    "torchmetrics>=1.0",
]
download = [
    "huggingface-hub>=0.36",
]
hub = [
    "huggingface-hub>=0.36",
]

[tool.design-generators]
framework = "transformers"
task = "content-aware-layout-generation"
conditions = [
    "content_image",
    "label",
    "label_size",
    "completion",
    "refinement",
    "unconditional",
]
datasets = ["cgl", "pku_posterlayout"]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "vendor_parity: checks requiring original PosterLlama assets",
]
