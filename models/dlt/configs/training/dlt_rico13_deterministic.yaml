trainer:
  devices: 1
  gradient_clip_val: 1.0
model:
  class_path: dlt.training.DLTTrainingModule
  init_args:
    config:
      class_path: dlt.configuration_dlt.DLTConfig
      init_args:
        dataset_name: rico13
        max_num_comp: 9
        categories_num: 15
    loss_box_weight: 5.0
    optimizer:
      class_path: torch.optim.AdamW
      init_args:
        lr: 0.0001
        betas: [0.95, 0.999]
        eps: 1.0e-8
        weight_decay: 1.0e-6
    lr_scheduler:
      class_path: dlt.training.DLTWarmupCosineSchedulerFactory
      init_args:
        num_warmup_steps: 10000
data:
  class_path: dlt.training.DLTDataModule
  init_args:
    batch_size: 64
    num_workers: 0
    max_num_comp: 9
    categories_num: 15
    seed: 42
    shuffle_train: true
