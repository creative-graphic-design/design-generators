[project]
name = "canvas-vae"
version = "0.1.0"
description = "Transformers-style CanvasVAE layout generation package."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jaxtyping>=0.3",
    "laygen",
    "numpy>=1.24",
    "safetensors>=0.4",
    "torch>=2.1",
    "transformers[torch]>=5.0.0",
]

[project.optional-dependencies]
convert = [
    "apache-beam[tfrecord]==2.76.0",
    "pyyaml>=6",
    "tensorflow-cpu==2.15.1",
    "traingen-parity",
]
training = [
    "jsonargparse[signatures]>=4.27.7",
    "lightning>=2.4,<3",
    "traingen",
    "traingen-parity",
]
vendor = [
    "apache-beam[tfrecord]==2.76.0",
    "pyyaml>=6",
    "tensorflow==2.15.1",
    # TensorFlow's NCCL wheel overwrites Torch's shared nvidia/nccl files.
    # Single-GPU TensorFlow does not use NCCL collectives.
    "nvidia-cublas-cu12==12.2.5.6",
    "nvidia-cuda-cupti-cu12==12.2.142",
    "nvidia-cuda-nvcc-cu12==12.2.140",
    "nvidia-cuda-nvrtc-cu12==12.2.140",
    "nvidia-cuda-runtime-cu12==12.2.140",
    "nvidia-cudnn-cu12==8.9.4.25",
    "nvidia-cufft-cu12==11.0.8.103",
    "nvidia-curand-cu12==10.3.3.141",
    "nvidia-cusolver-cu12==11.5.2.141",
    "nvidia-cusparse-cu12==12.1.2.141",
    "nvidia-nvjitlink-cu12==12.2.140",
    "traingen-parity",
]

[tool.uv.sources]
laygen = { workspace = true }
traingen = { workspace = true }
traingen-parity = { workspace = true }

[tool.design-generators]
framework = "transformers"
task = "content-agnostic-layout-generation"
conditions = ["unconditional"]
datasets = ["rico25", "crello"]
vendor = "CyberAgentAILab/canvas-vae"
paper = "https://arxiv.org/abs/2108.01249"

[tool.pytest.ini_options]
markers = [
    "training: tests that exercise Lightning training loops or training CLI entrypoints",
    "vendor_parity: requires the original TensorFlow environment, the RICO archive, and generated reference traces",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
