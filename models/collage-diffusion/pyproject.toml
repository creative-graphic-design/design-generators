[project]
name = "collage-diffusion"
version = "0.1.0"
description = "Diffusers pipeline for layer-conditioned collage harmonization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "diffusers[torch]>=0.36.0",
    "laygen",
    "jaxtyping>=0.3",
    "numpy>=1.24",
    "Pillow>=10.0",
    "torch>=2.1",
    "transformers>=5.0.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires model weights or external assets",
]

[tool.uv.sources]
laygen = { workspace = true }

[tool.coverage.run]
branch = true
source = ["collage_diffusion"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.design-generators]
framework = "diffusers"
task = "image-to-image-generation"
conditions = ["text", "image"]
datasets = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
