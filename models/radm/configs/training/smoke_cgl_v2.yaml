trainer:
  accelerator: cpu
  devices: 1
  max_steps: 2
  limit_val_batches: 0
  log_every_n_steps: 1
  default_root_dir: outputs/radm-training-smoke
model:
  class_path: radm.training.lightning_module.RADMTrainingModule
  init_args:
    num_classes: 5
    num_proposals: 8
    hidden_dim: 32
    text_feature_dim: 8
    num_train_timesteps: 10
data:
  class_path: radm.training.datamodule.RADMDataModule
  init_args:
    data_root: data/radm/cgl-dataset-v2
    batch_size: 2
    image_size: 64
    max_elements: 8
    max_text_num: 4
    text_feature_dim: 8
    max_train_samples: 4
    max_val_samples: 2
    text_feature_policy: zeros
