trainer:
  accelerator: gpu
  devices: 4
  strategy: ddp
  max_steps: 250000
  check_val_every_n_epoch:
  val_check_interval: 5000
  log_every_n_steps: 20
  default_root_dir: outputs/radm-training
  enable_checkpointing: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
model:
  class_path: radm.training.lightning_module.RADMTrainingModule
  init_args:
    num_classes: 5
    num_proposals: 100
    hidden_dim: 256
    text_feature_dim: 768
    num_train_timesteps: 1000
    snr_scale: 2.0
    learning_rate: 0.000025
    weight_decay: 0.0001
    lr_steps: [150000, 220000]
    max_iter: 250000
    grad_clip_norm: 1.0
    class_weight: 5.0
    bbox_weight: 1.0
    giou_weight: 1.0
    alpha: 0.25
    gamma: 2.0
    ota_k: 5
data:
  class_path: radm.training.datamodule.RADMDataModule
  init_args:
    data_root: data/radm/cgl-dataset-v2
    train_split: train
    val_split: validation
    batch_size: 4
    image_size: 800
    max_elements: 100
    max_text_num: 20
    text_feature_dim: 768
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    text_feature_policy: hf
