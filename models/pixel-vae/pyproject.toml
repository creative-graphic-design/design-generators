[project]
name = "pixel-vae"
version = "0.1.0"
description = "Transformers-style PixelVAE image encoder and decoder."
requires-python = ">=3.11"
dependencies = [
    "jaxtyping>=0.3",
    "laygen",
    "numpy>=1.24",
    "pillow>=10",
    "safetensors>=0.4",
    "torch>=2.1",
    "transformers[torch]>=5.0.0",
]

[project.optional-dependencies]
vendor = ["tensorflow-cpu==2.15.1"]
parity = ["traingen", "traingen-parity"]

[tool.uv.sources]
laygen = { workspace = true }
traingen = { workspace = true }
traingen-parity = { workspace = true }

[tool.design-generators]
framework = "transformers"
task = "image-feature-extraction"
conditions = ["evaluation"]
datasets = ["crello"]
vendor = "CyberAgentAILab/canvas-vae"
paper = "https://arxiv.org/abs/2108.01249"

[tool.pytest.ini_options]
markers = [
    "vendor_parity: requires TensorFlow and generated CPU reference artifacts",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
