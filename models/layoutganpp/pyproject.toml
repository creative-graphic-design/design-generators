[project]
name = "layoutganpp"
version = "0.1.0"
description = "Transformers-style LayoutGAN++ conversion package."
requires-python = ">=3.11"
dependencies = [
    "jaxtyping>=0.3",
    "laygen",
    "numpy>=1.24",
    "pillow>=10.0.0",
    "torch>=2.1",
    "transformers[torch]>=5.0.0",
]

[project.optional-dependencies]
training = [
    "datasets>=3",
    "jsonargparse[signatures]>=4.27.7",
    "lightning>=2.0.0",
    "traingen",
    "traingen-parity",
]
download = [
    "requests>=2.31",
]
hub = [
    "huggingface-hub>=1.0.0",
]
vendor = [
    "cma",
    "pycocotools",
    "pytorch-fid",
    "scipy>=1.7",
    "seaborn",
    "tensorboard",
    "torch-geometric>=2.5,<2.7",
]

[tool.uv.sources]
laygen = { workspace = true }
traingen = { workspace = true }
traingen-parity = { workspace = true }

[tool.design-generators]
framework = "transformers"
task = "content-agnostic-layout-generation"
conditions = ["label"]
datasets = ["rico13", "publaynet", "magazine"]

[tool.pytest.ini_options]
markers = [
    "training: tests that exercise Lightning training loops or training CLI entrypoints",
    "vendor_parity: requires original LayoutGAN++ weights and vendor dependencies",
]
