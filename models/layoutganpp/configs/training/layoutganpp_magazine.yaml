seed_everything: 42975
trainer:
  accelerator: gpu
  devices: 1
  precision: 32-true
  deterministic: true
  gradient_clip_val: 0.0
  max_epochs: -1
  max_steps: -1
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 50
  default_root_dir: .cache/layoutganpp/training-runs/magazine
  callbacks:
    - class_path: layoutganpp.training.callbacks.LayoutGANPPVendorSchedule
      init_args:
        iterations: 200000
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: .cache/layoutganpp/training-runs/magazine/checkpoints
        filename: "epoch={epoch:06d}-step={step:08d}-iou={val_maximum_iou:.6f}"
        monitor: val_maximum_iou
        mode: max
        save_top_k: 1
        auto_insert_metric_name: false
model:
  class_path: layoutganpp.training.LayoutGANPPTrainingModule
  init_args:
    dataset_name: magazine
    latent_size: 4
    generator_d_model: 256
    generator_nhead: 4
    generator_num_layers: 8
    discriminator_d_model: 256
    discriminator_nhead: 4
    discriminator_num_layers: 8
    discriminator_max_elements: 50
    learning_rate: 1.0e-5
data:
  class_path: layoutganpp.training.LayoutGANPPDataModule
  init_args:
    dataset_name: magazine
    data_root: .cache/layoutganpp/data/magazine
    batch_size: 64
    num_workers: 4
    seed: 42975
    shuffle_train: true
    pin_memory: true
