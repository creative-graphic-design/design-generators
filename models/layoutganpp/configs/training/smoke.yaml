seed_everything: 42975
trainer:
  accelerator: cpu
  devices: 1
  precision: 32-true
  deterministic: true
  max_epochs: 1
  limit_train_batches: 1
  limit_val_batches: 0
  num_sanity_val_steps: 0
  logger: false
  enable_checkpointing: false
  enable_model_summary: false
  default_root_dir: .cache/layoutganpp/training-runs/smoke
model:
  class_path: layoutganpp.training.LayoutGANPPTrainingModule
  init_args:
    dataset_name: magazine
    latent_size: 4
    generator_d_model: 16
    generator_nhead: 4
    generator_num_layers: 1
    discriminator_d_model: 16
    discriminator_nhead: 4
    discriminator_num_layers: 1
    discriminator_max_elements: 50
    learning_rate: 1.0e-5
    optimizer:
      class_path: torch.optim.Adam
data:
  class_path: layoutganpp.training.LayoutGANPPDataModule
  init_args:
    dataset_name: magazine
    batch_size: 2
    num_workers: 0
    synthetic_size: 4
    seed: 42975
    seed_mode: deterministic
    shuffle_train: false
