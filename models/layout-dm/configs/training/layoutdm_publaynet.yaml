seed_everything: false
trainer:
  accelerator: auto
  devices: auto
  precision: 32
  max_epochs: 50
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 1
        save_last: true
        filename: "epoch={epoch:02d}-val_loss={val_loss:.4f}"
model:
  class_path: layout_dm.training.LayoutDMTrainingModule
  init_args:
    config:
      class_path: layout_dm.LayoutDMConfig
      init_args:
        dataset_name: publaynet
        max_seq_length: 25
        num_timesteps: 100
        bbox_quantization: kmeans
        q_type: constrained
        cluster_centers_path: .cache/layout-dm/original/download/clustering_weights/publaynet_max25_kmeans_train_clusters.pkl
    learning_rate: 0.0005
    weight_decay: 0.1
    betas: [0.9, 0.98]
    auxiliary_loss_weight: 0.1
    adaptive_auxiliary_loss: true
    time_sampler: importance
    scheduler: reduce_on_plateau
    scheduler_factor: 0.5
    scheduler_patience: 2
    scheduler_threshold: 0.01
    seed_mode: default
data:
  class_path: layout_dm.training.LayoutDMDataModule
  init_args:
    dataset_name: publaynet
    config:
      class_path: layout_dm.LayoutDMConfig
      init_args:
        dataset_name: publaynet
        max_seq_length: 25
        num_timesteps: 100
        bbox_quantization: kmeans
        q_type: constrained
        cluster_centers_path: .cache/layout-dm/original/download/clustering_weights/publaynet_max25_kmeans_train_clusters.pkl
    batch_size: 64
    max_seq_length: 25
    num_workers: 4
    box_format: xywh
    normalized: true
    train_transforms: [RandomOrder]
