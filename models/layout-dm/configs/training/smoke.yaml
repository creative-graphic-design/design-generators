seed_everything: 42975
trainer:
  accelerator: cpu
  devices: 1
  precision: 32-true
  deterministic: true
  max_epochs: 1
  limit_train_batches: 1
  limit_val_batches: 0
  num_sanity_val_steps: 0
model:
  class_path: layout_dm.training.LayoutDMTrainingModule
  init_args:
    config:
      class_path: layout_dm.LayoutDMConfig
      init_args:
        dataset_name: publaynet
        max_seq_length: 4
        num_bin_bboxes: 8
        bbox_quantization: linear
        hidden_size: 16
        num_attention_heads: 4
        num_hidden_layers: 1
        intermediate_size: 32
        num_timesteps: 4
    learning_rate: 0.0005
    weight_decay: 0.1
    auxiliary_loss_weight: 0.1
    adaptive_auxiliary_loss: true
    time_sampler: uniform
    scheduler: null
    seed_mode: deterministic
data:
  class_path: layout_dm.training.LayoutDMDataModule
  init_args:
    dataset_name: publaynet
    config:
      class_path: layout_dm.LayoutDMConfig
      init_args:
        dataset_name: publaynet
        max_seq_length: 4
        num_bin_bboxes: 8
        bbox_quantization: linear
        hidden_size: 16
        num_attention_heads: 4
        num_hidden_layers: 1
        intermediate_size: 32
        num_timesteps: 4
    batch_size: 4
    max_seq_length: 4
    num_workers: 0
    synthetic_size: 4
    train_transforms: [RandomOrder]
