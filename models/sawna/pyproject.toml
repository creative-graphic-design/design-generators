[project]
name = "sawna"
version = "0.1.0"
description = "Diffusers pipelines for space-aware text-to-image generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "diffusers>=0.39.0",
    "huggingface-hub>=0.24",
    "jaxtyping>=0.3",
    "numpy>=1.24",
    "tkg-dm",
    "torch>=2.1",
    "transformers>=5.0.0",
]

[tool.design-generators]
framework = "diffusers"
task = "text-to-image-generation"
conditions = ["prompt"]
datasets = []

[tool.pytest.ini_options]
markers = [
    "integration: requires model weights or external assets",
    "vendor_parity: requires the temporary Space source and generated assets",
]

[tool.coverage.run]
branch = true
source = ["sawna"]
omit = ["*/tests/vendor_parity/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
